<!DOCTYPE html>
<html>

<head>

    <title>Interactive Humanoid Robot</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <h1>Interactive Humanoid Robot</h1>

    <div class="controls">

        <button onclick="sendCommand('forward')">
            FORWARD
        </button>

        <button onclick="sendCommand('backward')">
            BACKWARD
        </button>

        <button onclick="sendCommand('left')">
            LEFT
        </button>

        <button onclick="sendCommand('right')">
            RIGHT
        </button>

        <button onclick="sendCommand('stop')">
            STOP
        </button>

    </div>

    <div class="voice">

        <button onclick="startVoice()">
            🎤 VOICE COMMAND
        </button>

    </div>

    <script src="/static/script.js"></script>

</body>

</html>
